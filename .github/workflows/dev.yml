name: Dev Build

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  dev-build:
    name: Build & Test (dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          cd web
          npm install
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Install swag and generate docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/server/main.go -o docs

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          VERSION="0.0.0-dev.${SHORT_SHA}"
          COMMIT="${GITHUB_SHA}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MODULE=$(head -1 go.mod | awk '{print $2}')
          LDFLAGS="-s -w -X ${MODULE}/internal/version.Version=${VERSION} -X ${MODULE}/internal/version.Commit=${COMMIT} -X ${MODULE}/internal/version.Date=${DATE}"

          # 1. Bundled binary (frontend embedded)
          mkdir -p cmd/server/dist && cp -r web/dist/* cmd/server/dist/
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embed_frontend -ldflags "$LDFLAGS" -o life-dashboard-hub-linux-amd64-bundled ./cmd/server
          rm -rf cmd/server/dist

          # 2. Standalone binary (backend only)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o life-dashboard-hub-linux-amd64-standalone ./cmd/server

      - name: Upload dev binaries
        uses: actions/upload-artifact@v4
        with:
          name: dev-binaries
          path: |
            life-dashboard-hub-linux-amd64-bundled
            life-dashboard-hub-linux-amd64-standalone

  dev-docker:
    name: Build & Push Dev Docker Images
    needs: dev-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names and build timestamp
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          echo "IMAGE_BUNDLED=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "VERSION=0.0.0-dev.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push bundled dev Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.VERSION }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.DATE }}
          tags: |
            ${{ steps.meta.outputs.IMAGE_BUNDLED }}:dev

      - name: Build and push standalone dev Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.standalone
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.VERSION }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.DATE }}
          tags: |
            ${{ steps.meta.outputs.IMAGE_BUNDLED }}:dev-standalone
