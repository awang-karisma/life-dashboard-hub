name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      NEW_VERSION: ${{ steps.semver.outputs.NEW_VERSION }}
      TAG: ${{ steps.semver.outputs.TAG }}
      RELEASED: ${{ steps.semver.outputs.RELEASED }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install go-semver-release
        run: |
          curl -SL -o /usr/local/bin/go-semver-release https://github.com/s0ders/go-semver-release/releases/latest/download/go-semver-release-linux-amd64
          chmod +x /usr/local/bin/go-semver-release

      - name: Compute SemVer bump
        id: semver
        run: |
          go-semver-release release . --dry-run
          MAIN_SEMVER=$(grep '^MAIN_SEMVER=' "$GITHUB_OUTPUT" | cut -d= -f2-)
          MAIN_NEW_RELEASE=$(grep '^MAIN_NEW_RELEASE=' "$GITHUB_OUTPUT" | cut -d= -f2-)
          RELEASED="${MAIN_NEW_RELEASE:-false}"
          TAG="${MAIN_SEMVER}"
          NEW_VERSION="${MAIN_SEMVER#v}"

          echo "RELEASED=${RELEASED}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Version: ${NEW_VERSION}, Tag: ${TAG}, Released: ${RELEASED}"

      - name: Create and push git tag
        if: steps.semver.outputs.RELEASED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.semver.outputs.TAG }}" -m "Release ${{ steps.semver.outputs.TAG }}"
          git push origin "${{ steps.semver.outputs.TAG }}"

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.RELEASED == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          cd web
          npm install
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Install swag and generate docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/server/main.go -o docs

      - name: Build binaries
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.NEW_VERSION }}
        run: |
          EXT=""
          if [ "$OS" = "windows" ]; then
            EXT=".exe"
          fi
          COMMIT="${GITHUB_SHA}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MODULE=$(head -1 go.mod | awk '{print $2}')
          LDFLAGS="-s -w -X ${MODULE}/internal/version.Version=${VERSION} -X ${MODULE}/internal/version.Commit=${COMMIT} -X ${MODULE}/internal/version.Date=${DATE}"

          # 1. Bundled binary (frontend embedded)
          mkdir -p cmd/server/dist && cp -r web/dist/* cmd/server/dist/
          CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build -tags embed_frontend -ldflags "$LDFLAGS" -o "life-dashboard-hub-$OS-$ARCH-bundled$EXT" ./cmd/server
          rm -rf cmd/server/dist

          # 2. Standalone binary (backend only)
          CGO_ENABLED=0 GOOS=$OS GOARCH=$ARCH go build -ldflags "$LDFLAGS" -o "life-dashboard-hub-$OS-$ARCH-standalone$EXT" ./cmd/server

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            life-dashboard-hub-${{ matrix.os }}-${{ matrix.arch }}-bundled*
            life-dashboard-hub-${{ matrix.os }}-${{ matrix.arch }}-standalone*

  docker:
    name: Build & Push Docker Images
    needs: version
    if: needs.version.outputs.RELEASED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names and build timestamp
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BUNDLED=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push bundled Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.NEW_VERSION }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.DATE }}
          tags: |
            ${{ steps.meta.outputs.IMAGE_BUNDLED }}:${{ needs.version.outputs.NEW_VERSION }}
            ${{ steps.meta.outputs.IMAGE_BUNDLED }}:latest

      - name: Build and push standalone Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.NEW_VERSION }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.DATE }}
          tags: |
            ${{ steps.meta.outputs.IMAGE_BUNDLED }}:${{ needs.version.outputs.NEW_VERSION }}-standalone
            ${{ steps.meta.outputs.IMAGE_BUNDLED }}:latest-standalone

  release:
    name: GitHub Release
    needs: [version, build, docker]
    if: needs.version.outputs.RELEASED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: 'binaries-*'
          merge-multiple: true
          path: release-binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.TAG }}
          name: ${{ needs.version.outputs.TAG }}
          generate_release_notes: true
          files: release-binaries/*
